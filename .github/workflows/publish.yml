name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}"
            echo "Expected vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix."
            exit 1
          fi

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          package_dir="kaoyan-english-grader-${GITHUB_REF_NAME}"
          mkdir -p dist

          git archive --format=tar.gz --prefix="${package_dir}/" "${GITHUB_SHA}" \
            > "dist/${package_dir}.tar.gz"
          git archive --format=zip --prefix="${package_dir}/" "${GITHUB_SHA}" \
            > "dist/${package_dir}.zip"

          (
            cd dist
            sha256sum "${package_dir}.tar.gz" "${package_dir}.zip" > SHA256SUMS
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/kaoyan-english-grader-${{ github.ref_name }}.zip
            dist/kaoyan-english-grader-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
