name: Bootstrap initial v1.0.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.0.0-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release target
        uses: actions/checkout@v4
        with:
          ref: c4a354288f225dd08e81be214188cc6beef5d1ee
          fetch-depth: 0

      - name: Build release archives
        env:
          RELEASE_TAG: v1.0.0
          TARGET_SHA: c4a354288f225dd08e81be214188cc6beef5d1ee
        shell: bash
        run: |
          set -euo pipefail

          package_dir="kaoyan-english-grader-${RELEASE_TAG}"
          mkdir -p dist

          git archive --format=tar.gz --prefix="${package_dir}/" "${TARGET_SHA}" \
            > "dist/${package_dir}.tar.gz"
          git archive --format=zip --prefix="${package_dir}/" "${TARGET_SHA}" \
            > "dist/${package_dir}.zip"

          (
            cd dist
            sha256sum "${package_dir}.tar.gz" "${package_dir}.zip" > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
          TARGET_SHA: c4a354288f225dd08e81be214188cc6beef5d1ee
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "dist/kaoyan-english-grader-${RELEASE_TAG}.zip" \
            "dist/kaoyan-english-grader-${RELEASE_TAG}.tar.gz" \
            "dist/SHA256SUMS" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --latest
